services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      STORY_PATH: /app/data/story.json
    depends_on:
      - redis
