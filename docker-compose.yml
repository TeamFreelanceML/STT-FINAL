version: "3.9"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      STT_MODEL_NAME: ${STT_MODEL_NAME:-base}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_EVALUATION_API_BASE_URL: ${NEXT_PUBLIC_EVALUATION_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_TTS_WORD_API_URL: ${NEXT_PUBLIC_TTS_WORD_API_URL:-http://host.docker.internal:8001/narrate/word}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_EVALUATION_API_BASE_URL: ${NEXT_PUBLIC_EVALUATION_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_TTS_WORD_API_URL: ${NEXT_PUBLIC_TTS_WORD_API_URL:-http://host.docker.internal:8001/narrate/word}
    depends_on:
      - backend
